[package]
name = "jolt-akita-recursion-guest"
version = "0.1.0"
edition = "2021"
publish = false

[features]
ntt-inline = ["akita-algebra/ntt-inline"]
guest = [
  "jolt-akita-recursion/akita",
  "dep:jolt-akita",
  "jolt/guest-std",
  "jolt/stdout",
  "jolt/random",
  "jolt/thread",
]

[dependencies]
jolt = { package = "jolt-sdk", path = "../../../jolt-sdk", default-features = false }
jolt-akita-recursion = { path = ".." }
jolt-akita = { workspace = true, default-features = false, optional = true }

jolt-transcript = { workspace = true, features = ["blake2-inline"] }
akita-algebra = { workspace = true }

[lib]
test = false
doctest = false

[[bin]]
name = "jolt-akita-recursion-guest"
path = "src/main.rs"
test = false
bench = false

# Direct dependencies select the guest transcript and challenge inlines.
[package.metadata.cargo-machete]
ignored = ["akita-algebra", "jolt-transcript"]
