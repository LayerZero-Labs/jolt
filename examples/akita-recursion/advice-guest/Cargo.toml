[package]
name = "jolt-akita-advice-guest"
version = "0.1.0"
edition = "2021"
publish = false
[features]
ntt-inline = ["akita-algebra/ntt-inline"]
guest = [
  "dep:jolt-akita-external",
  "dep:jolt-akita",
  "dep:jolt-transcript",
  "dep:akita-algebra",
  "jolt/guest-std",
  "jolt/stdout",
  "jolt/random",
  "jolt/thread",
]
[dependencies]
jolt = { package = "jolt-sdk", path = "../../../jolt-sdk", default-features = false }
jolt-akita-external = { path = "../replay", features = [
  "akita",
], optional = true }
jolt-akita = { workspace = true, default-features = false, optional = true }
jolt-transcript = { workspace = true, features = [
  "blake2-inline",
], optional = true }
akita-algebra = { workspace = true, optional = true }
[lib]
test = false
doctest = false
[[bin]]
name = "jolt-akita-advice-guest"
path = "src/main.rs"
test = false
bench = false

# Direct dependencies select the guest transcript and challenge inlines.
[package.metadata.cargo-machete]
ignored = ["akita-algebra", "jolt-transcript"]
